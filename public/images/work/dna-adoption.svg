<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1a1a1a"/>

  <!-- Grid background -->
  <defs>
    <pattern id="grid-adoption" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-adoption)"/>

  <!-- Adoption metrics visualization -->
  <g opacity="0.8">
    <!-- Timeline axis -->
    <line x1="100" y1="320" x2="700" y2="320" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Time markers -->
    <text x="100" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666">Q1</text>
    <text x="250" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666">Q2</text>
    <text x="400" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666">Q3</text>
    <text x="550" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666">Q4</text>
    <text x="700" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666">Present</text>

    <!-- Adoption curve -->
    <path d="M 100 310 Q 200 280, 250 250 T 400 180 T 550 130 T 700 100"
          stroke="rgba(255,255,255,0.3)"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>

    <!-- Fill area under curve -->
    <path d="M 100 310 Q 200 280, 250 250 T 400 180 T 550 130 T 700 100 L 700 320 L 100 320 Z"
          fill="rgba(255,255,255,0.03)"/>

    <!-- Data points -->
    <circle cx="100" cy="310" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="250" cy="250" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="400" cy="180" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="550" cy="130" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="700" cy="100" r="6" fill="rgba(255,255,255,0.8)"/>

    <!-- Metrics cards -->
    <g transform="translate(100, 80)">
      <rect width="140" height="60" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="70" y="25" text-anchor="middle" font-family="monospace" font-size="24" fill="#e8e8e8" font-weight="500">20+</text>
      <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0a0a0">Components</text>
    </g>

    <g transform="translate(270, 80)">
      <rect width="140" height="60" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="70" y="25" text-anchor="middle" font-family="monospace" font-size="24" fill="#e8e8e8" font-weight="500">40%</text>
      <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0a0a0">Time Saved</text>
    </g>

    <g transform="translate(440, 80)">
      <rect width="140" height="60" rx="4" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="70" y="25" text-anchor="middle" font-family="monospace" font-size="24" fill="#e8e8e8" font-weight="500">100%</text>
      <text x="70" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#a0a0a0">WCAG AA</text>
    </g>

    <!-- Y-axis label -->
    <text x="50" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666" transform="rotate(-90 50 200)">Adoption Rate</text>
  </g>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666" letter-spacing="1">IMPACT METRICS</text>
  <text x="400" y="430" text-anchor="middle" font-family="monospace" font-size="10" fill="#666666" opacity="0.6">Team Adoption & Measurable Outcomes</text>
</svg>